name: Sync CSV Products to Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Process Products CSV
        run: |
          echo "Starting synchronization..."
          # سيقوم الكود بقراءة ملف الـ CSV وتحويله لمنتجات داخل مجلد content/products تلقائياً
          # باستخدام الرمز السري الذي أضفناه للتو
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
